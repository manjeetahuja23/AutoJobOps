version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: pnpm --filter @autojobops/api dev
    ports:
      - "4000:4000"
    volumes:
      - ./:/workspace
    working_dir: /workspace
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    command: pnpm --filter @autojobops/web dev
    ports:
      - "3000:3000"
    volumes:
      - ./:/workspace
    working_dir: /workspace
